name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5

      - name: Instalar Python y dependencias
        run: uv sync

      - name: Linter (ruff)
        run: uv run ruff check .

      - name: Tipos (mypy)
        run: uv run mypy src

      - name: Tests (pytest)
        run: uv run pytest