[project]
name = "estudio-ia-datos"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Camilo Abella", email = "camiloabella752@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.2",
    "redis>=8.1.0",
    "rq>=3.0.0",
    "sqlmodel>=0.0.48",
    "uvicorn>=0.54.0",
]

[project.scripts]
estudio-ia-datos = "estudio_ia_datos:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
